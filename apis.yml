description: Quantum Motion is a UK-based full-stack quantum computing company building
  scalable, fault-tolerant quantum computers using silicon (CMOS) technology, the same
  manufacturing process used for conventional microchips. Spun out of University College
  London and the University of Oxford, the company develops qubit control hardware,
  cryogenic electronics, and quantum architecture aimed at manufacturing quantum processors
  at scale. It is a research- and hardware-focused company rather than an API or developer-platform
  provider; this profile was surfaced as a portfolio company of DCVC and added to the API
  Evangelist network. As of this enrichment pass no public developer API, documentation
  portal, or SDK surface could be verified (the corporate site sits behind bot-challenge
  protection and web search was unavailable), so the profile remains identity-only.
